<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%93%B0%3C/text%3E%3C/svg%3E">
<meta name="color-scheme" content="light dark">
<title>🔒 X 每日精選｜請輸入密碼</title>
<style>
:root{--bg:#eef1f5;--panel:#fff;--text:#0e1116;--muted:#5c667a;--border:#d8dee6;--accent:#0e7c7b;--err:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#0e1116;--panel:#171b22;--text:#e8edf5;--muted:#9aa6b5;--border:#2a313c;--accent:#2dd4bf;--err:#f97066}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;font-family:"Avenir Next","PingFang TC","Noto Sans TC","Segoe UI",sans-serif;color:var(--text);
background:
radial-gradient(900px 480px at 0% 0%,rgba(14,124,123,.18),transparent 55%),
radial-gradient(700px 420px at 100% 100%,rgba(217,119,6,.12),transparent 50%),
var(--bg)}
.box{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:28px 24px;box-shadow:0 18px 50px rgba(14,17,22,.08)}
.logo{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;background:linear-gradient(145deg,#0e7c7b,#134e4a);color:#fff;margin-bottom:14px;font-weight:700;letter-spacing:-.02em}
h1{margin:0 0 4px;font-size:1.3rem;font-family:"Iowan Old Style","Palatino Linotype","Noto Serif TC",serif;font-weight:600}
p.sub{margin:0 0 20px;color:var(--muted);font-size:.9rem;line-height:1.5}
label.f{display:block;font-size:.78rem;color:var(--muted);margin-bottom:6px}
.pw{display:flex;gap:8px}
input[type=password],input[type=text]{flex:1;min-width:0;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text);font-size:1rem;outline:none}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(14,124,123,.22)}
.eye{border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:12px;padding:0 12px;cursor:pointer}
.rem{display:flex;align-items:center;gap:8px;margin:14px 0 18px;font-size:.88rem;cursor:pointer}
.rem input{width:16px;height:16px;accent-color:var(--accent)}
button.go{width:100%;padding:12px;border:0;border-radius:12px;font-size:1rem;font-weight:600;color:#fff;cursor:pointer;background:var(--accent)}
button.go:disabled{opacity:.6;cursor:progress}
.msg{min-height:1.4em;margin-top:12px;font-size:.88rem;color:var(--err)}
.msg.info{color:var(--muted)}
.foot{margin-top:18px;font-size:.75rem;color:var(--muted);line-height:1.5}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
</style>
</head>
<body>
<form class="box" id="f" autocomplete="off">
  <div class="logo">X</div>
  <h1>X 每日精選</h1>
  <p class="sub">此頁面已加密，請輸入密碼以檢視內容。</p>
  <label class="f" for="pw">密碼</label>
  <div class="pw"><input type="password" id="pw" autocomplete="current-password" required autofocus><button type="button" class="eye" id="eye" aria-label="顯示密碼">👁</button></div>
  <label class="rem"><input type="checkbox" id="rem"> 記住此裝置（不儲存密碼，只儲存解密金鑰）</label>
  <button class="go" id="go" type="submit">解鎖</button>
  <div class="msg" id="msg" role="alert"></div>
  <div class="foot">🔐 內容以 AES-256-GCM 加密，金鑰由密碼在您的瀏覽器中以 PBKDF2-SHA256（600,000 次）衍生；伺服器上只有密文。首頁與文章頁共用同一把裝置金鑰。</div>
  <noscript><p class="msg">需要啟用 JavaScript 才能解密此頁面。</p></noscript>
</form>

const KS="xdigest-device-key-v1";
const LOGOUT="\n<div id=\"xd-logout\" style=\"position:fixed;right:14px;bottom:14px;z-index:2147483000\">\n<button type=\"button\" onclick=\"try{localStorage.removeItem('xdigest-device-key-v1')}catch(e){};location.reload()\" style=\"font:12px -apple-system,BlinkMacSystemFont,'PingFang TC','Noto Sans TC',sans-serif;padding:6px 10px;border-radius:999px;border:1px solid rgba(127,127,127,.35);background:rgba(127,127,127,.15);color:inherit;backdrop-filter:blur(6px);cursor:pointer;opacity:.75\">\ud83d\udd12 \u767b\u51fa\uff0f\u5fd8\u8a18\u6b64\u88dd\u7f6e<\/button>\n<\/div>\n";
const $=id=>document.getElementById(id);
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const bu=b=>{let s="";const a=new Uint8Array(b);for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(s)};
const msg=(t,info)=>{const m=$("msg");m.textContent=t;m.className="msg"+(info?" info":"")};
if(!(window.crypto&&crypto.subtle)){msg("此瀏覽器不支援 WebCrypto，請改用最新版 Chrome／Safari／Edge／Firefox，並以 https 開啟。");$("go").disabled=true;return}
async function decryptWith(key){
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(P.iv)},key,ub(P.ct));
  return new TextDecoder("utf-8").decode(pt);
}
function show(html){
  const i=html.lastIndexOf("</body>");
  html=i>=0?html.slice(0,i)+LOGOUT+html.slice(i):html+LOGOUT;
  document.open();document.write(html);document.close();
}
async function deriveRaw(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  return crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:ub(P.salt),iterations:P.iter},base,256);
}
const imp=raw=>crypto.subtle.importKey("raw",raw,{name:"AES-GCM"},false,["decrypt"]);
(async()=>{
  let s=null;try{s=JSON.parse(localStorage.getItem(KS)||"null")}catch(e){}
  if(!s)return;
  if(s.salt!==P.salt||!s.key){try{localStorage.removeItem(KS)}catch(e){}return}
  try{msg("正在以已記住的裝置金鑰解鎖…",true);show(await decryptWith(await imp(ub(s.key))))}
  catch(e){try{localStorage.removeItem(KS)}catch(_){};msg("")}
})();
$("eye").onclick=()=>{const p=$("pw");p.type=p.type==="password"?"text":"password"};
$("f").addEventListener("submit",async e=>{
  e.preventDefault();const pw=$("pw").value;if(!pw)return;
  $("go").disabled=true;msg("解密中…",true);
  try{
    const raw=await deriveRaw(pw);
    const html=await decryptWith(await imp(raw));
    if($("rem").checked){try{localStorage.setItem(KS,JSON.stringify({salt:P.salt,key:bu(raw)}))}catch(e){}}
    else{try{localStorage.removeItem(KS)}catch(e){}}
    show(html);
  }catch(err){
    $("go").disabled=false;msg("密碼錯誤，請再試一次。");
    const b=$("f");b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake");$("pw").select();
  }
});
})();
